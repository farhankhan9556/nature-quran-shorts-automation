name: Daily Live Earning Shorts

on:

  schedule:

    - cron: "17 6 * * *"
      timezone: "Asia/Dubai"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  create-shorts:

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |

          sudo apt-get update

          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

      - name: Install Chromium
        run: |

          python -m playwright install --with-deps chromium

      - name: Generate 3 live website earning Shorts
        run: |

          python live_earning_demo.py

      - name: Check output
        run: |

          echo "Generated files:"

          ls -lh output/

          test -f output/online_earning_short_1.mp4

          test -f output/online_earning_short_2.mp4

          test -f output/online_earning_short_3.mp4

      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:

          name: live-online-earning-shorts

          path: output/

          retention-days: 3
