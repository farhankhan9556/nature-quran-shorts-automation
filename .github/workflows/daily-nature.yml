name: Daily Nature Quran Shorts

on:
  workflow_dispatch:

  schedule:
    - cron: "15 8 * * *"
      timezone: "Asia/Dubai"

jobs:
  create-nature-shorts:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Pexels API key
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "PEXELS_API_KEY is missing"
            exit 1
          fi

          echo "Pexels API key detected"

      - name: Create 3 Nature Quran Shorts
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python nature_quran_generator.py

      - name: Check generated files
        run: |
          ls -lh output
          test -f output/nature_quran_short_1.mp4
          test -f output/nature_quran_short_2.mp4
          test -f output/nature_quran_short_3.mp4
          test -f output/metadata.txt

      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:
          name: nature-quran-shorts
          path: output/
          retention-days: 7
