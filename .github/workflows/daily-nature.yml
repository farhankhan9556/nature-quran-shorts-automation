name: Daily Nature Quran Shorts

on:
  workflow_dispatch:

  schedule:
    - cron: "15 8 * * *"
      timezone: "Asia/Dubai"

jobs:

  create-nature-shorts:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Pexels API key
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "PEXELS_API_KEY is missing"
            exit 1
          fi
          echo "Pexels API key detected"

      - name: Test Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python test_pexels.py

      - name: Run Nature content engine
        run: |
          python nature_quran_generator.py
